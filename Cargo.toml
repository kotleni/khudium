[package]
name = "khudium"
version = "0.1.0"
edition = "2021"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tiny-skia = "0.11"
fontdue = "0.8"
evdev = "0.12"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
nix = { version = "0.29", features = ["fs"] }
